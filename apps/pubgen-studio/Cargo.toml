[package]
name = "pubgen-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "pubgen-studio"

[lints]
workspace = true

[dependencies]
designcraft-engine = { workspace = true }
pubgen-core = { workspace = true }
designcraft-ui-egui = { workspace = true, features = ["pubgen"] }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links", "clipboard"] }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rfd = { workspace = true }
arboard = { workspace = true }
zip = { workspace = true }
chrono = { workspace = true }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
winsafe = { version = "0.0.29", default-features = false, features = ["user"] }
