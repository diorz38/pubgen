[workspace]
resolver = "2"
members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
zip = "2"
quick-xml = "0.36"
calamine = "0.28"
csv = "1"
ureq = { version = "2", features = ["json"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "tokio", "canvas", "advanced", "image-without-codecs"] }
tokio = { version = "1", default-features = false, features = ["rt"] }

[profile.release]
lto = "thin"

# The craft-suite winit fork carries the shared IME/language-support patches
# (W1–W27) used by every Craft application. iced pulls winit transitively, so
# the patch must stay even though no crate here depends on winit directly.
[patch.crates-io]
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
